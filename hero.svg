<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#222" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#eee" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fafafa" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <!-- background subtle texture -->
  <rect width="100%" height="100%" fill="#f6f2ee"/>

  <!-- large dark backdrop to mimic photo shadow -->
  <path d="M900 0 L1600 0 L1600 1200 L700 1200 Q820 700 900 0 Z" fill="url(#g1)"/>

  <!-- flowing fabric layers: multiple translucent Bezier shapes -->
  <g filter="url(#soft)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M950 120 C1100 220 1100 420 980 600 C880 760 760 900 700 1050" stroke="#ffffff" stroke-opacity="0.06" stroke-width="420"/>
    <path d="M930 80 C1080 200 1080 420 940 620 C830 760 720 880 660 1040" stroke="#ffffff" stroke-opacity="0.08" stroke-width="360"/>
    <path d="M860 40 C1000 180 980 400 880 610 C780 750 680 860 600 1000" stroke="#ffffff" stroke-opacity="0.12" stroke-width="260"/>

    <path d="M1200 200 C1220 320 1150 500 980 720 C890 840 760 960 680 1060" stroke="#dcdcdc" stroke-opacity="0.18" stroke-width="220"/>
    <path d="M1050 50 C1180 220 1120 430 1000 650 C900 800 800 920 720 1040" stroke="#e8e8e8" stroke-opacity="0.14" stroke-width="180"/>
  </g>

  <!-- delicate mesh folds using translucent strokes -->
  <g stroke="#bfbfbf" stroke-opacity="0.12" stroke-width="2" fill="none">
    <path d="M1100 140 C1020 300 980 420 940 560 C900 700 860 820 780 950"/>
    <path d="M1150 210 C1060 340 1000 480 960 620 C920 760 880 870 820 980"/>
    <path d="M980 80 C930 240 900 380 860 540 C820 700 760 840 700 980"/>
  </g>

  <!-- vignette subtle border on right to emulate photograph shading -->
  <rect x="900" y="0" width="700" height="1200" fill="black" opacity="0.06"/>

  <!-- faint grain overlay -->
  <g opacity="0.04" fill="#000">
    <!-- small dots pattern generated as repeated circles -->
    <defs>
      <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.6" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grain)"/>
  </g>

  <!-- subtle highlight near center-left of the hero area -->
  <ellipse cx="980" cy="420" rx="260" ry="420" fill="#fff" opacity="0.03"/>

  <!-- small ornamental ring to suggest a hand with ring silhouette -->
  <g transform="translate(1220,220) scale(1)">
    <ellipse cx="0" cy="0" rx="46" ry="12" fill="#fff" opacity="0.045"/>
    <path d="M-12 4 C-6 18 6 18 12 4" stroke="#fff" stroke-opacity="0.06" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

</svg>
